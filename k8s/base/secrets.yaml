---
# PostgreSQL credentials
# IMPORTANT: Replace placeholder values before deploying!
# You can generate secrets with: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: linkwarden
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: linkwarden
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
  POSTGRES_USER: "linkwarden"
  POSTGRES_DB: "linkwarden"

---
# Linkwarden application secrets
apiVersion: v1
kind: Secret
metadata:
  name: linkwarden-secrets
  namespace: linkwarden
  labels:
    app.kubernetes.io/name: linkwarden
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: linkwarden
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  NEXTAUTH_SECRET: "CHANGE_ME_nextauth_secret"

---
# MeiliSearch master key
apiVersion: v1
kind: Secret
metadata:
  name: meilisearch-credentials
  namespace: linkwarden
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: linkwarden
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  MEILI_MASTER_KEY: "CHANGE_ME_meili_master_key"
